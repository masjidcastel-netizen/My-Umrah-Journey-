# Cloud build of the Android debug APK with GameCI (https://game.ci). UNVERIFIED: never run yet.
# Needs repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_LICENSE  - contents of your Unity .ulf licence file (Personal: create it with GameCI's
#                    "request activation file" flow, see docs/BUILD_GUIDE.md)  [or UNITY_SERIAL/UNITY_EMAIL/UNITY_PASSWORD]
# If UNITY_LICENSE is missing the job stops with a clear message. It never fakes success.
name: Build Android (debug APK)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check Unity licence secret
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::No Unity licence configured. Add the UNITY_LICENSE secret (see docs/BUILD_GUIDE.md). Build NOT attempted."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: Android
          unityVersion: auto
          buildMethod: MyUmrah.EditorTools.BuildScript.BuildDebugApk
          allowDirtyBuild: true
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyUmrahJourney-debug-apk
          path: Builds/**/*.apk
          if-no-files-found: error
